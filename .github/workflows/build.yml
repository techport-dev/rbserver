name: Build rbserver

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg (for .deb packaging)
        run: brew install ldid dpkg

      - name: Install Python deps (build_deb.sh imports wda_ctl.py for its bplist encoder)
        run: pip3 install --break-system-packages -r requirements.txt

      - name: Install Appium + XCUITest driver (vendors WebDriverAgent source)
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Build WDA
        run: ./scripts/build_wda.sh

      - name: Package .deb
        # Strip the leading "v" so a v1.0.1 tag produces rbserver_1.0.1_...deb,
        # matching the release it gets attached to below; build_deb.sh defaults
        # to 1.0.0 on non-tag builds (push to main, manual dispatch).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="1.0.0"; fi
          ./scripts/build_deb.sh "$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbserver-deb
          path: build/*.deb

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh release upload` needs an existing Release object, which a plain
        # `git tag && git push` doesn't create (confirmed live: "release not
        # found") -- `gh release create --generate-notes` makes one if it's
        # missing, or the --clobber upload just fills in the asset if it
        # already exists.
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" build/*.deb --clobber
